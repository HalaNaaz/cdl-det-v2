title: Potential Authentication Brute Force - Multiple Failed Logons
id: a4b5c6d7-8901-23ab-cdef-444444444444
status: test
description: Detects failed logon events (Event ID 4625) indicating potential brute-force or credential guessing activity against network or interactive services.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Cyberion Defense Labs
date: 2026/08/05
modified: 2026/10/26
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    service: security
    product: windows
detection:
    selection:
        EventID: 4625
        LogonType:
            - 3   # Network
            - 8   # NetworkCleartext
            - 10  # RemoteInteractive (RDP)
    condition: selection
falsepositives:
    - User mistyping passwords during interactive logons.
    - Legacy automated backup services with expired credentials.
level: medium