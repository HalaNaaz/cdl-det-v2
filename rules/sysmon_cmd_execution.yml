title: Suspicious Command Shell Execution
id: c4d5e6f7-8901-23ab-cdef-444444444444
status: test
description: Detects Windows Command Shell (cmd.exe) launching suspicious utility commands or reconnaissance operations.
references:
    - https://attack.mitre.org/techniques/T1059/003/
author: Cyberion Defense Labs
date: 2026/08/05
modified: 2026/10/26
tags:
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd.exe'
        CommandLine|contains:
            - '/c whoami'
            - '/c net user'
            - '/c net localgroup'
    condition: selection
falsepositives:
    - Normal system administration scripts and software deployment tasks.
level: low