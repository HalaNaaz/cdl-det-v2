title: PowerShell ScriptBlock Logging - Credential Access Invocation
id: b9c0d1e2-3456-78ab-cdef-999999999999
status: test
description: Detects execution of PowerShell script blocks containing suspicious credential dumping commands or post-exploitation keywords (e.g. Mimikatz, securlsa).
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1003/001/
author: Cyberion Defense Labs
date: 2026/08/05
modified: 2026/10/26
tags:
    - attack.execution
    - attack.credential-access
    - attack.t1059.001
    - attack.t1003.001
logsource:
    service: powershell
    product: windows
detection:
    selection:
        EventID:
            - 4103
            - 4104
        Payload|contains:
            - 'securlsa::logonpasswords'
            - 'lsadump::sam'
            - 'Invoke-Mimikatz'
            - 'DumpCreds'
    condition: selection
falsepositives:
    - Authorized security testing scripts or administrative modules reviewing credential caches.
level: high